services:
  portfolio:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - ./.data:/app/.data
      - ./uploads:/app/uploads
